<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef3f1;
font-family:-apple-system,Segoe UI,Roboto,sans-serif;color:#1d2b27;text-align:center}a{color:#1f4d45;font-weight:600}</style>
</head><body><div><h2>Opening Work Hub…</h2><p>If nothing happens, <a id="go" href="https://exclusively-tier-conditional-encounter.trycloudflare.com">click here</a>.</p></div>
<script>
// Browsers may keep an old copy of this page, so always read the newest tool address fresh (url.txt).
(async () => {
  let u = "https://exclusively-tier-conditional-encounter.trycloudflare.com";
  try {
    const r = await fetch("url.txt?t=" + Date.now(), {cache: "no-store"});
    const t = (await r.text()).trim();
    if (r.ok && /^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(t)) u = t;
  } catch (e) { /* use the address in this page */ }
  document.getElementById("go").href = u;
  location.replace(u + location.pathname.replace(/^\/workhub\.com\/?/, "/").replace(/^\/$/, "") + location.search);
})();
</script></body></html>
